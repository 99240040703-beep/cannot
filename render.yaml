databases:
  - name: imei-guardian-db
    databaseName: imei_guardian
    user: imei_guardian
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: 16
services:
  - type: web
    name: imei-guardian
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imei-guardian-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: IMEI_ENCRYPTION_KEY
        generateValue: true